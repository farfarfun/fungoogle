[project]
name = "fungoogle"
version = "0.0.2"
description = "个人 Google Colab 环境初始化脚本：挂载 Drive、装依赖、拷贝个人文件"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["farlog>=1.1.7", "funshell>=1.0.23"]

[project.optional-dependencies]
# packages() 在 Colab notebook 运行时额外安装的个人常用包，仅用于声明版本下限、
# 供依赖扫描工具识别；实际安装动作仍由 packages() 在 notebook 里触发（见该函数注释）。
colab = ["funutil>=1.0.63", "kaggle>=1.6.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fungoogle"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.8.0"]

[tool.ruff]
target-version = "py310"
