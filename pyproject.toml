[project]
name = "fungoogle"
version = "0.0.2"
description = "个人 Google Colab 环境初始化脚本：挂载 Drive、装依赖、拷贝个人文件"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["farlog>=1.1.7", "funshell>=1.0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fungoogle"]

[dependency-groups]
dev = ["pytest>=7.0"]
